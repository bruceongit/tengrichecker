[variables]
NODE_ENV = "production"
PORT = "3001"
HONEY_POT_PORT = "3001"
HONEY_POT_DATA = "/data"

[build]
builder = "nixpacks/nixpacks"

[nixpkgs]
nixpkgs = ["nodejs-20_x"]

[start]
cmd = "node server.js"

[deploy]
health_check_path = "/api/health"
restart_policy_type = "ON_FAILURE"
restart_policy_max_retries = 10
