[variables]
NODE_ENV = "production"
PORT = "3001"
HONEY_POT_PORT = "3001"
HONEY_POT_DATA = "/data"

[build]
builder = "nixpacks/nixpacks"

[nixpkgs]
nixpkgs = ["nodejs-20_x"]

[start]
# Run server with /usr/bin/node (default in nixpkgs nodejs-20_x)
cmd = "NODE_ENV=production PORT=3001 /usr/bin/node server.js"

[deploy]
health_check_path = "/api/health"
restart_policy_type = "ON_FAILURE"
restart_policy_max_retries = 10
