[variables]
NODE_ENV = "production"
PORT = "3001"
NETWORK_PORT = "3001"
NETWORK_DATA = "/data"

[build]
builder = "nixpacks/nixpacks"

[nixpkgs]
nixpkgs = ["nodejs-20_x"]

[start]
# Run server with fallback for different node binary locations
cmd = "sh -c 'exec node server.js || exec /usr/local/bin/node server.js || exec /usr/bin/node server.js'"

[deploy]
health_check_path = "/api/health"
restart_policy_type = "ON_FAILURE"
restart_policy_max_retries = 10
