[variables]
NODE_ENV = "production"
PORT = "3001"
NETWORK_PORT = "3001"
NETWORK_DATA = "/data"

[phases.setup]
nixPkgs = ["nodejs-20_x"]

[phases.build]
buildCommand = "npm install && npm run build"

[phases.deploy]
# Run server with node binary at /usr/bin/node (nixpkgs default)
startCommand = "/usr/bin/node server.js"

[phases.install]
packages = ["nodejs-20_x"]

[deploy]
healthCheckPath = "/api/health"
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10
