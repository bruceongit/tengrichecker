[variables]
NODE_ENV = "production"
PORT = "3001"
NETWORK_PORT = "3001"
NETWORK_DATA = "/data"

[build]
builder = "nixpacks/nixpacks"

[nixpkgs]
nixpkgs = ["nodejs-20_x"]

[start]
# Run server (node is in PATH from node:20-alpine image)
cmd = "NODE_ENV=production PORT=3001 node server.js"

[deploy]
health_check_path = "/api/health"
restart_policy_type = "ON_FAILURE"
restart_policy_max_retries = 10
