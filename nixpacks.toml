[variables]
NODE_ENV = "production"
PORT = "3001"
NETWORK_PORT = "3001"
NETWORK_DATA = "/data"

[phases.setup]
nixPkgs = ["nodejs-20_x"]

[phases.build]
buildCommand = "npm install && npm run build"

[phases.deploy]
# Run server (node is available in PATH from Railway's runtime)
startCommand = "node server.js"

[phases.install]
packages = ["nodejs-20_x"]

[deploy]
healthCheckPath = "/api/health"
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10
