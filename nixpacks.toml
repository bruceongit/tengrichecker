[variables]
NODE_ENV = "production"
PORT = "3001"
NETWORK_PORT = "3001"
NETWORK_DATA = "/data"

[phases.setup]
# Don't install node via nixpkgs - use the one from Railway's node:20-alpine image
nixPkgs = []

[phases.build]
buildCommand = "npm install && npm run build"

[phases.deploy]
# Run server with 'node' command (available in Railway's runtime PATH)
startCommand = "node server.js"

[deploy]
healthCheckPath = "/api/health"
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10
